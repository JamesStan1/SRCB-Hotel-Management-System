<!DOCTYPE html>
<html>
<head>
  <title>Run Database Migration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      background: #10b981;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 20px 0;
    }
    button:hover {
      background: #059669;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>
  <h1>🔧 Database Migration</h1>
  <p>This will add the required columns to the <code>reservations</code> table:</p>
  <ul>
    <li><strong>status</strong> - VARCHAR(50) - For tracking reservation status</li>
    <li><strong>package_name</strong> - VARCHAR(255) - For storing package name</li>
    <li><strong>updated_at</strong> - TIMESTAMP - For tracking updates</li>
  </ul>
  
  <button id="migrateBtn" onclick="runMigration()">Run Migration</button>
  
  <div id="result"></div>

  <script>
    async function runMigration() {
      const btn = document.getElementById('migrateBtn');
      const resultDiv = document.getElementById('result');
      
      btn.disabled = true;
      btn.textContent = 'Running migration...';
      resultDiv.style.display = 'none';
      
      try {
        const response = await fetch('/api/migrate-reservations', {
          method: 'POST'
        });
        
        const data = await response.json();
        
        resultDiv.style.display = 'block';
        
        if (response.ok) {
          resultDiv.className = 'success';
          resultDiv.innerHTML = `
            <h3>✅ Success!</h3>
            <p>${data.message}</p>
            <p>Rows updated: ${data.rowsUpdated || 0}</p>
          `;
          btn.textContent = 'Migration Complete';
        } else {
          throw new Error(data.error || 'Migration failed');
        }
      } catch (error) {
        resultDiv.style.display = 'block';
        resultDiv.className = 'error';
        resultDiv.innerHTML = `
          <h3>❌ Error!</h3>
          <p>${error.message}</p>
        `;
        btn.disabled = false;
        btn.textContent = 'Try Again';
      }
    }
  </script>
</body>
</html>
